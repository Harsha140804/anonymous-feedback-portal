name: PHP syntax checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php --version
      - name: Validate all PHP sources
        run: |
          set -eu
          find anonymous-feedback-portal-phase1 anonymous-feedback-portal-phase2 -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
      - name: Verify repository hygiene
        run: |
          test -f database/schema.sql
          test ! -e anonymous-feedback-portal-phase2/test_db.php
          test ! -e anonymous-feedback-portal-phase1/test_db.php
