name: PHP static security scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep==1.183.0
          semgrep --version

      - name: Scan the secure application only
        run: |
          mkdir -p scan-results
          semgrep scan --config p/php --metrics off \
            --json --output scan-results/semgrep-secure.json apps/secure

      - name: Summarise static findings
        if: always()
        run: |
          if [ -f scan-results/semgrep-secure.json ]; then
            python - <<'PY'
          import json
          with open('scan-results/semgrep-secure.json', encoding='utf-8') as f:
              report = json.load(f)
          findings = report.get('results', [])
          print(f"Semgrep findings: {len(findings)}")
          for finding in findings:
              location = finding.get('start', {}).get('line', '?')
              print(f"{finding.get('path')}:{location} {finding.get('check_id')} "
                    f"severity={finding.get('extra', {}).get('severity')}")
          PY
          fi

      - name: Store scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-secure-json
          path: scan-results/semgrep-secure.json
          if-no-files-found: warn
